<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="flechaEv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E35B1"/>
    </marker>
    <marker id="flechaDb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C62828"/>
    </marker>
  </defs>

  <rect width="1500" height="900" fill="#FFFFFF"/>
  <text x="750" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#1A237E">Sistema de Gestión de Usuarios y Roles — Arquitectura Orientada a Eventos</text>
  <text x="750" y="60" text-anchor="middle" font-size="14" fill="#546E7A">DSY2207 · Evaluación Final Transversal · BFF Spring Boot + Azure Functions (Java 17) + Azure Event Grid + Oracle XE</text>

  <rect x="200" y="78" width="1280" height="800" rx="14" fill="#F3F8FD" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="220" y="104" font-size="16" font-weight="bold" fill="#0078D4">Microsoft Azure · región brazilsouth · grupo rg-dsy2207-eft</text>

  <rect x="20" y="398" width="150" height="74" rx="10" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="95" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Cliente</text>
  <text x="95" y="451" text-anchor="middle" font-size="12" fill="#455A64">Postman</text>

  <rect x="225" y="350" width="215" height="170" rx="10" fill="#E0F2F1" stroke="#00695C" stroke-width="2"/>
  <text x="332" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#00695C">MICROSERVICIO BFF</text>
  <text x="332" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#004D40">Spring Boot 3</text>
  <text x="332" y="413" text-anchor="middle" font-size="12" fill="#00695C">Azure App Service (F1)</text>
  <line x1="240" y1="424" x2="425" y2="424" stroke="#80CBC4"/>
  <text x="332" y="442" text-anchor="middle" font-size="11" fill="#004D40">REST: /api/bff/usuarios · /roles</text>
  <text x="332" y="460" text-anchor="middle" font-size="11" fill="#004D40">GraphQL: /api/bff/graphql/...</text>
  <text x="332" y="478" text-anchor="middle" font-size="11" fill="#004D40">Eventos: /api/bff/eventos/...</text>
  <text x="332" y="500" text-anchor="middle" font-size="10" font-style="italic" fill="#00695C">valida que el rol exista</text>

  <rect x="500" y="140" width="255" height="130" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="627" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">FUNCIÓN GENERADORA</text>
  <text x="627" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#1B5E20">fn-usuarios</text>
  <text x="627" y="206" text-anchor="middle" font-size="12" fill="#2E7D32">CRUD · API REST + GraphQL</text>
  <text x="627" y="228" text-anchor="middle" font-size="11" fill="#1B5E20">publica: UsuarioCreado</text>
  <text x="627" y="244" text-anchor="middle" font-size="11" fill="#1B5E20">UsuarioActualizado · UsuarioEliminado</text>
  <text x="627" y="262" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">persiste en Oracle (JDBC)</text>

  <rect x="500" y="600" width="255" height="130" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="627" y="624" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">FUNCIÓN GENERADORA</text>
  <text x="627" y="646" text-anchor="middle" font-size="15" font-weight="bold" fill="#1B5E20">fn-roles</text>
  <text x="627" y="666" text-anchor="middle" font-size="12" fill="#2E7D32">CRUD · API REST + GraphQL</text>
  <text x="627" y="688" text-anchor="middle" font-size="11" fill="#1B5E20">publica: RolCreado</text>
  <text x="627" y="704" text-anchor="middle" font-size="11" fill="#1B5E20">RolActualizado · RolEliminado</text>

  <rect x="810" y="335" width="225" height="190" rx="12" fill="#EDE7F6" stroke="#5E35B1" stroke-width="3"/>
  <text x="922" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#5E35B1">AZURE EVENT GRID</text>
  <text x="922" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#311B92">Topic personalizado</text>
  <text x="922" y="402" text-anchor="middle" font-size="12" fill="#4527A0">egt-usuarios-roles</text>
  <line x1="830" y1="416" x2="1015" y2="416" stroke="#B39DDB"/>
  <text x="922" y="436" text-anchor="middle" font-size="11" fill="#4527A0">Esquema Event Grid</text>
  <text x="922" y="454" text-anchor="middle" font-size="11" fill="#4527A0">tipo: Duoc.UsuariosRoles.*</text>
  <text x="922" y="472" text-anchor="middle" font-size="11" fill="#4527A0">4 suscripciones con filtro</text>
  <text x="922" y="490" text-anchor="middle" font-size="11" fill="#4527A0">reintentos: hasta 10</text>
  <text x="922" y="508" text-anchor="middle" font-size="11" fill="#4527A0">entrega push (webhook)</text>

  <rect x="1120" y="120" width="345" height="455" rx="12" fill="#FFF8E1" stroke="#E65100" stroke-width="2"/>
  <text x="1292" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">FUNCIONES CONSUMIDORAS</text>
  <text x="1292" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#BF360C">fn-eventos</text>

  <rect x="1138" y="178" width="310" height="66" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
  <text x="1293" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#B71C1C">asignarRolPorDefecto</text>
  <text x="1293" y="217" text-anchor="middle" font-size="11" fill="#5D4037">Usuario creado sin rol → se le asigna CONSULTA</text>
  <text x="1293" y="233" text-anchor="middle" font-size="10" font-weight="bold" fill="#5E35B1">sub-rol-por-defecto · filtro UsuarioCreado</text>

  <rect x="1138" y="254" width="310" height="66" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
  <text x="1293" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#B71C1C">quitarRolUsuarios</text>
  <text x="1293" y="293" text-anchor="middle" font-size="11" fill="#5D4037">Rol eliminado → se quita a todos sus usuarios</text>
  <text x="1293" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#5E35B1">sub-quitar-rol · filtro RolEliminado</text>

  <rect x="1138" y="330" width="310" height="66" rx="8" fill="#FFFFFF" stroke="#EF6C00"/>
  <text x="1293" y="351" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">auditarEvento</text>
  <text x="1293" y="369" text-anchor="middle" font-size="11" fill="#5D4037">Registra todos los eventos (idempotente)</text>
  <text x="1293" y="385" text-anchor="middle" font-size="10" font-weight="bold" fill="#5E35B1">sub-auditoria · sin filtro (todos)</text>

  <rect x="1138" y="406" width="310" height="66" rx="8" fill="#FFFFFF" stroke="#EF6C00"/>
  <text x="1293" y="427" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">notificarUsuario</text>
  <text x="1293" y="445" text-anchor="middle" font-size="11" fill="#5D4037">Bienvenida, desactivación y eliminación</text>
  <text x="1293" y="461" text-anchor="middle" font-size="10" font-weight="bold" fill="#5E35B1">sub-notificaciones · filtro Usuario*</text>

  <rect x="1138" y="484" width="310" height="78" rx="8" fill="#FFFDE7" stroke="#F9A825" stroke-dasharray="5 3"/>
  <text x="1293" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#8D6E00">Consultas HTTP</text>
  <text x="1293" y="525" text-anchor="middle" font-size="11" fill="#5D4037">GET /api/auditoria</text>
  <text x="1293" y="543" text-anchor="middle" font-size="11" fill="#5D4037">GET /api/notificaciones</text>

  <rect x="1120" y="640" width="345" height="215" rx="12" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
  <text x="1292" y="666" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">BASE DE DATOS</text>
  <text x="1292" y="688" text-anchor="middle" font-size="15" font-weight="bold" fill="#B71C1C">Oracle XE 21c</text>
  <text x="1292" y="708" text-anchor="middle" font-size="12" fill="#C62828">Azure Container Instances</text>
  <text x="1292" y="736" text-anchor="middle" font-size="12" fill="#4E342E">USUARIOS · ROLES</text>
  <text x="1292" y="756" text-anchor="middle" font-size="12" fill="#4E342E">AUDITORIA_EVENTOS · NOTIFICACIONES</text>
  <text x="1292" y="786" text-anchor="middle" font-size="11" fill="#6D4C41">Sin FK entre usuarios y roles:</text>
  <text x="1292" y="802" text-anchor="middle" font-size="11" fill="#6D4C41">la consistencia la mantienen los eventos</text>
  <text x="1292" y="826" text-anchor="middle" font-size="11" fill="#6D4C41">EVENTO_ID único → idempotencia</text>

  <line x1="170" y1="435" x2="221" y2="435" stroke="#37474F" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="195" y="425" text-anchor="middle" font-size="10" fill="#37474F">HTTPS</text>

  <path d="M440,385 C470,385 465,205 496,205" fill="none" stroke="#37474F" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="438" y="280" width="62" height="34" rx="4" fill="#F3F8FD" opacity="0.92"/>
  <text x="469" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#37474F">REST +</text>
  <text x="469" y="308" text-anchor="middle" font-size="10" font-weight="bold" fill="#37474F">GraphQL</text>
  <path d="M440,485 C470,485 465,665 496,665" fill="none" stroke="#37474F" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="438" y="556" width="62" height="34" rx="4" fill="#F3F8FD" opacity="0.92"/>
  <text x="469" y="570" text-anchor="middle" font-size="10" font-weight="bold" fill="#37474F">REST +</text>
  <text x="469" y="584" text-anchor="middle" font-size="10" font-weight="bold" fill="#37474F">GraphQL</text>

  <path d="M332,350 L332,116 L1474,116 L1474,523 L1452,523" fill="none" stroke="#37474F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flecha)"/>
  <text x="790" y="111" font-size="12" fill="#37474F">consultas de auditoría y notificaciones (HTTPS)</text>

  <path d="M755,225 C800,225 800,365 806,375" fill="none" stroke="#5E35B1" stroke-width="2.5" marker-end="url(#flechaEv)"/>
  <text x="782" y="292" text-anchor="middle" font-size="11" fill="#5E35B1" transform="rotate(75 782 292)">publica evento</text>
  <path d="M755,645 C800,645 800,495 806,485" fill="none" stroke="#5E35B1" stroke-width="2.5" marker-end="url(#flechaEv)"/>
  <text x="782" y="575" text-anchor="middle" font-size="11" fill="#5E35B1" transform="rotate(-75 782 575)">publica evento</text>

  <path d="M1035,360 C1085,360 1085,211 1134,211" fill="none" stroke="#C62828" stroke-width="2.5" marker-end="url(#flechaDb)"/>
  <path d="M1035,400 C1085,400 1085,287 1134,287" fill="none" stroke="#C62828" stroke-width="2.5" marker-end="url(#flechaDb)"/>
  <path d="M1035,440 C1085,440 1085,363 1134,363" fill="none" stroke="#5E35B1" stroke-width="2.5" marker-end="url(#flechaEv)"/>
  <path d="M1035,480 C1085,480 1085,439 1134,439" fill="none" stroke="#5E35B1" stroke-width="2.5" marker-end="url(#flechaEv)"/>


  <path d="M627,730 L627,775 L1116,775" fill="none" stroke="#C62828" stroke-width="2" marker-end="url(#flechaDb)"/>
  <text x="860" y="768" text-anchor="middle" font-size="11" fill="#C62828">JDBC (ojdbc11)</text>
  <line x1="1292" y1="575" x2="1292" y2="636" stroke="#C62828" stroke-width="2" marker-end="url(#flechaDb)"/>
  <text x="1300" y="610" font-size="11" fill="#C62828">JDBC</text>

  <rect x="20" y="590" width="440" height="235" rx="10" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="38" y="616" font-size="13" font-weight="bold" fill="#263238">Reglas del requerimiento resueltas con eventos</text>
  <text x="38" y="642" font-size="12" font-weight="bold" fill="#B71C1C">1. Rol por defecto al crear un usuario</text>
  <text x="52" y="662" font-size="12" fill="#37474F">POST usuario sin rol → fn-usuarios publica</text>
  <text x="52" y="680" font-size="12" fill="#37474F">UsuarioCreado → asignarRolPorDefecto le</text>
  <text x="52" y="698" font-size="12" fill="#37474F">asigna CONSULTA</text>
  <text x="38" y="724" font-size="12" font-weight="bold" fill="#B71C1C">2. Quitar el rol al eliminarlo</text>
  <text x="52" y="744" font-size="12" fill="#37474F">DELETE rol → fn-roles publica RolEliminado</text>
  <text x="52" y="762" font-size="12" fill="#37474F">→ quitarRolUsuarios deja sin rol a sus usuarios</text>
  <text x="38" y="790" font-size="11" font-style="italic" fill="#607D8B">El cliente recibe la respuesta al instante; las reacciones</text>
  <text x="38" y="806" font-size="11" font-style="italic" fill="#607D8B">ocurren de forma asíncrona y desacoplada.</text>
</svg>
